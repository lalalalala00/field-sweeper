<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="인터넷 없이 즐기는 두뇌 퍼즐 모음. 지뢰찾기, 스도쿠, 시카쿠, 후토시키.">
<meta name="theme-color" content="#f6f4ec">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="assets/paper.css">
<style>
/* 앱의 HomeView.swift: 메모 패드처럼 정리된 첫 화면 */
body { display: flex; flex-direction: column; min-height: 100dvh; }
.home { width: 100%; max-width: 560px; margin: 0 auto; flex: 1;
  padding: max(28px, env(safe-area-inset-top)) max(28px, env(safe-area-inset-right)) 24px max(28px, env(safe-area-inset-left));
  display: flex; flex-direction: column; gap: 24px; }
.head { padding-bottom: 14px; border-bottom: 1px solid var(--ink); display: flex; flex-direction: column; gap: 6px; }
.head h1 { margin: 0; font: 600 34px/1.1 var(--f-serif); letter-spacing: -.5px; }
.head p { margin: 0; font-size: 12px; color: var(--ink-soft); }
.cards { display: flex; flex-direction: column; gap: 12px; }
.gcard { display: flex; flex-direction: column; gap: 16px; padding: 18px 18px 16px; border-radius: 4px; text-decoration: none;
  background: var(--fill); color: var(--text); transition: opacity .1s; }
.gcard:active { opacity: .8; }
.gcard .top { display: flex; align-items: baseline; justify-content: space-between; }
.gcard .name { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 500; }
.gcard .sym { width: 17px; height: 17px; }
.gcard .no { font: 12px var(--f-serif); color: var(--ink-soft); }
.gcard .cells { display: flex; gap: 10px; font-size: 11px; line-height: 1.5; }
.gcard .cells div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.foot { position: sticky; bottom: 0; width: 100%; max-width: 560px; margin: 0 auto; background: var(--bg);
  padding: 12px max(28px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) max(28px, env(safe-area-inset-left));
  display: flex; flex-direction: column; gap: 4px; }
.stamp { display: flex; justify-content: flex-end; gap: 18px; padding-bottom: 5px; border-bottom: 1px solid var(--rule); }
.stamp span { display: flex; align-items: baseline; gap: 8px; font-size: 12px; font-variant-numeric: tabular-nums; }
.stamp i { font: normal 11px var(--f-serif); color: var(--ink-soft); }
.links { display: flex; align-items: center; gap: 22px; }
.links button { display: flex; align-items: center; gap: 7px; min-height: 44px; border: 0; background: none; padding: 0; font-size: 15px; }
.links button::before { content: ""; width: 11px; height: 11px; border: 1px solid var(--ink); border-radius: 50%; }
.seal { margin-left: auto; font: 10px var(--f-serif); padding: 3px 10px; border: 1px solid var(--ink); border-radius: 50%; }

/* 기록·설정 시트 */
.scrim.sheet-scrim { place-items: end center; padding: 0; }
@media (min-width: 700px) { .scrim.sheet-scrim { place-items: center; padding: 24px; } }
.sheet { width: 100%; max-width: 600px; max-height: 92dvh; overflow-y: auto; background: var(--bg); border-radius: 16px 16px 0 0;
  padding: 0 20px max(20px, env(safe-area-inset-bottom)); animation: rise .25s ease-out; }
@media (min-width: 700px) { .sheet { border-radius: 16px; } }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }
.sheet-head { position: sticky; top: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 0; background: var(--bg); z-index: 1; }
.sheet-head h2 { grid-column: 2; margin: 0; font-size: 17px; font-weight: 600; }
.sheet-head button { grid-column: 3; justify-self: end; border: 0; background: none; font-size: 17px; font-weight: 600; padding: 6px 2px; }
.sheet-body { display: flex; flex-direction: column; gap: 12px; }
.scard { display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 4px; background: var(--fill); color: var(--text); font-size: 12px; }
.scard .top { display: flex; align-items: baseline; justify-content: space-between; }
.scard .name { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 500; }
.scard .sym { width: 17px; height: 17px; }
.scard .no { font: 12px var(--f-serif); }
.scard .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.scard .grid div { display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.scard .rows div { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid color-mix(in srgb, var(--text) 30%, transparent); }
.scard .rows span:first-child { flex: 1; }
.scard .rows span:last-child { min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .07em; color: var(--ink-soft); margin: 6px 0 0; }
.group { border: 1px solid var(--rule); border-radius: 4px; }
.group > * + * { border-top: 1px solid var(--rule); }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px; font-size: 15px; text-decoration: none; }
.opt span { display: flex; flex-direction: column; gap: 2px; }
.opt b { font-weight: 500; }
.opt small { font-size: 12px; color: var(--ink-soft); }
.opt select { font: inherit; font-size: 15px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); }
.opt svg { width: 14px; height: 14px; color: var(--ink-soft); }
.opt.static small { font-size: 15px; }
.switch { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; flex: none; margin: 0; border-radius: 99px; background: var(--rule); position: relative; cursor: pointer; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .2); transition: transform .2s; }
.switch:checked { background: var(--fill-minesweeper); }
.switch:checked::after { transform: translateX(20px); }
</style>
<title>nemo in nemo</title>
</head>
<body>
<main class="home">
  <header class="head">
    <h1>nemo in nemo</h1>
    <p id="tagline"></p>
  </header>
  <nav class="cards" id="cards"></nav>
</main>
<footer class="foot">
  <div class="stamp" aria-hidden="true"><span><i>no.</i><b id="no">000</b></span><span><i>date.</i><b id="date"></b></span></div>
  <div class="links">
    <button id="openStats"></button>
    <button id="openSettings"></button>
    <span class="seal" aria-hidden="true">nemo</span>
  </div>
</footer>
<script src="assets/i18n.js"></script>
<script src="assets/common.js"></script>
<script src="assets/number-puzzle.js"></script>
<script>
(() => {
  const { t, store, stats, clock, esc } = Nemo;
  const $ = id => document.getElementById(id);
  const pct = p => `${Math.round(p * 100)}% · ${t('이어하기')}`;
  const LEVEL_NAMES = ['초급', '중급', '고급', '전문가', '커스텀'];

  // 지뢰찾기는 minesweeper.html의 저장 형식을 그대로 읽는다.
  const isTablet = Math.min(screen.width, screen.height) >= 700;
  const DEFAULT_MS = isTablet ? { id: 'normal', name: '중급', cols: 24, rows: 16, mines: 80 } : { id: 'normal', name: '중급', cols: 11, rows: 16, mines: 35 };
  const msKey = c => `${Math.min(c.cols, c.rows)}x${Math.max(c.cols, c.rows)}m${c.mines}`;

  // 카드 아래 두 칸: 진행, 최고 기록
  function summary(id) {
    if (id === 'minesweeper') {
      const sv = store.get('saved', null);
      let progress = t('새 게임');
      if (sv && Array.isArray(sv.st) && Array.isArray(sv.mines)) {
        const safe = Math.max(1, sv.st.length - sv.mines.length);
        progress = pct(sv.st.filter(v => v === 1).length / safe);
      }
      const cfg = store.get('cfg', null) || DEFAULT_MS;
      const best = store.get('best', {})[msKey(cfg)];
      return [[t('진행'), progress], [`${t('최고 기록')} · ${t(cfg.id === 'custom' ? '커스텀' : cfg.name || '중급')}`, best ? clock(best) : '—']];
    }
    const sv = store.get(id + '.save', null);
    let progress = t('새 게임');
    if (sv && sv.puzzle) {
      if (id === 'shikaku') {
        const n = sv.puzzle.size;
        progress = pct(sv.regions.reduce((a, r) => a + r.rect.height * r.rect.width, 0) / (n * n));
      } else progress = pct(NumberPuzzle.progress(sv));
    }
    const level = LEVEL_NAMES[(sv?.puzzle?.level || store.get(id + '.lastLevel', 2)) - 1] || '중급';
    const best = stats.load(id).bestByDifficulty[level];
    return [[t('진행'), progress], [`${t('최고 기록')} · ${t(level)}`, best != null ? clock(best) : '—']];
  }

  const colors = id => `--fill: var(--fill-${id}); --text: var(--text-${id})`;
  function render() {
    document.title = `nemo in nemo · ${t('네모 안에 네모')}`;
    $('tagline').textContent = t('네모 안에 네모 · 작은 네모 속, 커다란 생각.');
    $('cards').replaceChildren(...Nemo.KINDS.map(k => {
      const a = document.createElement('a');
      a.className = 'gcard';
      a.href = k.href;
      a.style.cssText = colors(k.id);
      const [first, second] = summary(k.id);
      a.innerHTML = `<div class="top"><span class="name">${Nemo.symbol(k.id)}${k.title}</span><span class="no">${k.number}</span></div>
        <div class="cells"><div><span>${esc(first[0])}</span><span>${esc(first[1])}</span></div><div><span>${esc(second[0])}</span><span>${esc(second[1])}</span></div></div>`;
      return a;
    }));
    $('no').textContent = String(Math.min(stats.totalPlays(), 999)).padStart(3, '0');
    $('date').textContent = new Intl.DateTimeFormat(Nemo.lang === 'zh' ? 'zh-Hans' : Nemo.lang, { month: 'numeric', day: 'numeric' }).format(new Date());
    $('openStats').textContent = t('기록');
    $('openSettings').textContent = t('설정');
  }

  function sheet(title, body) {
    const el = Nemo.overlay(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
      <div class="sheet-head"><h2 id="shTitle">${esc(title)}</h2><button data-done>${t('완료')}</button></div>
      <div class="sheet-body">${body}</div></div>`, { onBackdrop: () => Nemo.close() });
    el.classList.add('sheet-scrim');
    el.querySelector('[data-done]').onclick = () => Nemo.close();
    return el;
  }

  // 앱의 StatsView.swift: 게임별 기록
  $('openStats').onclick = () => {
    sheet(t('기록'), Nemo.KINDS.map(k => {
      const s = stats.load(k.id);
      let body;
      if (!s.plays) body = `<div>${t('아직 기록이 없어요')}</div>`;
      else {
        const cell = (label, value) => `<div><span>${t(label)}</span><span>${value}</span></div>`;
        const rate = s.plays ? `${Math.round(s.completions / s.plays * 100)}%` : '—';
        const avg = s.completions ? clock(Math.floor(s.totalSeconds / s.completions)) : '—';
        const names = Object.keys(s.completionsByDifficulty).sort((a, b) => (s.completionsByDifficulty[b] - s.completionsByDifficulty[a]) || a.localeCompare(b));
        body = `<div class="grid">${cell('플레이', s.plays)}${cell('완료', s.completions)}${cell('완료율', rate)}${cell('평균 시간', avg)}</div>`
          + (names.length ? `<div class="rows">${names.map(name => `<div><span>${esc(t(name))}</span><span>${t('완료 {0}', s.completionsByDifficulty[name])}</span><span>${s.bestByDifficulty[name] != null ? clock(s.bestByDifficulty[name]) : '—'}</span></div>`).join('')}</div>` : '');
      }
      return `<section class="scard" style="${colors(k.id)}"><div class="top"><span class="name">${Nemo.symbol(k.id)}${k.title}</span><span class="no">${k.number}</span></div>${body}</section>`;
    }).join(''));
  };

  // 앱의 AppSettingsView.swift: 모든 게임에 함께 적용되는 설정
  $('openSettings').onclick = () => {
    const langs = [['auto', t('기기 설정')], ['ko', '한국어'], ['ja', '日本語'], ['zh', '中文'], ['en', 'English']];
    const el = sheet(t('설정'), `<p class="label">${t('옵션')}</p>
      <div class="group">
        <label class="opt"><span><b>${t('시간 표시')}</b><small>${t('끄면 시간 없이 느긋하게 플레이해요')}</small></span><input type="checkbox" class="switch" data-timer></label>
        <label class="opt"><b>${t('언어')}</b><select data-lang>${langs.map(([v, n]) => `<option value="${v}">${esc(n)}</option>`).join('')}</select></label>
      </div>
      <p class="label">${t('정보')}</p>
      <div class="group">
        <a class="opt" href="privacy.html">${t('개인정보 처리방침')}${Nemo.icon('external')}</a>
        <div class="opt static"><b>${t('버전')}</b><small>${t('웹')}</small></div>
      </div>`);
    const timer = el.querySelector('[data-timer]'), lang = el.querySelector('[data-lang]');
    timer.checked = store.get('showTimer', true);
    timer.onchange = () => store.set('showTimer', timer.checked);
    lang.value = Nemo.langPref;
    lang.onchange = () => { Nemo.setLang(lang.value); render(); $('openSettings').click(); };
  };

  render();
  // 게임에서 뒤로 돌아오면(bfcache 포함) 진행·기록을 다시 읽는다.
  window.addEventListener('pageshow', render);
})();
</script>
</body>
</html>
