<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="칸 묶음마다 적힌 계산이 맞도록 숫자를 채우는 셈네모. 4×4부터 7×7까지 네 가지 난이도.">
<meta name="theme-color" content="#f6f4ec">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="assets/paper.css">
<style>:root { --accent: var(--fill-calc); }</style>
<title>Calc Squares</title>
</head>
<body>
<div class="puzzle" id="app">
  <div class="stage">
    <div class="board-wrap empty" id="wrap"><canvas class="board" id="board" role="img"></canvas></div>
  </div>
  <div class="controls">
    <div class="tools">
      <button class="tool" id="undo"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span></span></button>
      <button class="tool" id="erase"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 20H20"/><path d="M5.6 15.6l8.5-8.5a2 2 0 0 1 2.8 0l2 2a2 2 0 0 1 0 2.8L12 18.8a4 4 0 0 1-2.8 1.2H8.6a2 2 0 0 1-1.4-.6l-1.6-1.6a2 2 0 0 1 0-2.2z"/><path d="M10 11.2l4.8 4.8"/></svg><span></span></button>
      <button class="tool" id="note" aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4.5L15.5 5a2.1 2.1 0 0 1 3 3L8 18.5z"/><path d="M13.5 7l3 3"/></svg><span></span></button>
    </div>
    <div class="keys" id="keys"></div>
  </div>
</div>
<script src="assets/i18n.js"></script>
<script src="assets/common.js"></script>
<script src="assets/rules.js"></script>
<script src="assets/calc-engine.js"></script>
<script src="assets/number-puzzle.js"></script>
<script>
(() => {
  const E = CalcEngine, { t } = Nemo;

  const peerCache = {};
  const peers = n => peerCache[n] || (peerCache[n] = [...Array(n * n)].map((_, i) => {
    const r = Math.floor(i / n), c = i % n, out = [];
    for (let k = 0; k < n; k++) { if (k !== c) out.push(r * n + k); if (k !== r) out.push(k * n + c); }
    return out;
  }));
  // 칸 → 묶음 번호
  const ownerCache = new WeakMap();
  const ownerOf = p => {
    if (!ownerCache.has(p)) { const o = new Array(p.size * p.size).fill(-1); p.cages.forEach((c, k) => c.cells.forEach(i => { o[i] = k; })); ownerCache.set(p, o); }
    return ownerCache.get(p);
  };
  const opsText = ops => [...ops].map(o => E.SYMBOL[o]).join(' ');

  function draw(ctx, side, G, opts, n) {
    const c = name => Nemo.cssColor(name);
    const cell = side / n, p = G.puzzle, owner = ownerOf(p);
    const conflicts = opts.showConflicts ? new Set(G.values.map((v, i) => (v && peers(n)[i].some(q => G.values[q] === v) ? i : -1)).filter(i => i >= 0)) : new Set();
    const wrongCages = new Set(opts.showWrongCages ? E.wrongCages(p, G.values) : []);
    const sel = G.selected, selValue = sel != null ? G.values[sel] : 0;
    const font = (size, weight) => `${weight} ${size}px system-ui, -apple-system, sans-serif`;
    ctx.save();
    Nemo.roundRect(ctx, 0, 0, side, side, 6);
    ctx.clip();

    // 칸 바탕과 숫자
    for (let i = 0; i < n * n; i++) {
      const x = (i % n) * cell, y = Math.floor(i / n) * cell, given = !!p.givens[i];
      let fill = '--cell';
      if (sel != null) {
        if (i === sel) fill = '--fill-calc';
        else if (selValue && G.values[i] === selValue) fill = '--cc-same';
        else if (Math.floor(i / n) === Math.floor(sel / n) || i % n === sel % n) fill = '--cc-related';
      }
      ctx.fillStyle = c(fill);
      ctx.fillRect(x, y, cell + 0.5, cell + 0.5);
      const v = G.values[i];
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (v) {
        ctx.fillStyle = c(conflicts.has(i) && !given ? '--wrong' : given ? '--ink' : '--user');
        ctx.font = font(cell * 0.46, given ? 600 : 400);
        ctx.fillText(v, x + cell / 2, y + cell * 0.58);
      } else if (G.notes[i]) {
        // 메모는 이름표 아래 공간에 작게
        const cols = n <= 4 ? 2 : 3, rows = Math.ceil(n / cols), top = cell * 0.3, h = cell - top - cell * 0.06;
        ctx.font = font(cell * (n <= 4 ? 0.2 : 0.17), 500);
        for (let d = 1; d <= n; d++) {
          if (!(G.notes[i] & (1 << d))) continue;
          ctx.fillStyle = c(selValue === d ? '--ink' : '--ink-soft');
          ctx.fillText(d, x + cell * (((d - 1) % cols) + 0.5) / cols, y + top + h * (Math.floor((d - 1) / cols) + 0.5) / rows);
        }
      }
    }

    // 칸 선: 같은 묶음 안은 가는 선, 묶음 경계는 굵은 선
    ctx.beginPath();
    for (let i = 0; i < n * n; i++) {
      const r = Math.floor(i / n), col = i % n;
      if (col < n - 1 && owner[i] === owner[i + 1]) { const x = Math.round((col + 1) * cell) + 0.5; ctx.moveTo(x, r * cell); ctx.lineTo(x, (r + 1) * cell); }
      if (r < n - 1 && owner[i] === owner[i + n]) { const y = Math.round((r + 1) * cell) + 0.5; ctx.moveTo(col * cell, y); ctx.lineTo((col + 1) * cell, y); }
    }
    ctx.strokeStyle = c('--thin'); ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i < n * n; i++) {
      const r = Math.floor(i / n), col = i % n;
      if (col < n - 1 && owner[i] !== owner[i + 1]) { const x = Math.round((col + 1) * cell); ctx.moveTo(x, r * cell); ctx.lineTo(x, (r + 1) * cell); }
      if (r < n - 1 && owner[i] !== owner[i + n]) { const y = Math.round((r + 1) * cell); ctx.moveTo(col * cell, y); ctx.lineTo((col + 1) * cell, y); }
    }
    ctx.strokeStyle = c('--ink'); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.stroke();

    // 묶음 이름표: 왼쪽 위 칸에 "12×". 1칸 묶음은 숫자가 이미 주어져 있어 이름표를 쓰지 않는다.
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.font = font(Math.max(10, cell * 0.21), 700);
    p.cages.forEach((cage, k) => {
      if (cage.op === '=') return;
      const i = cage.cells[0], x = (i % n) * cell, y = Math.floor(i / n) * cell;
      ctx.fillStyle = c(wrongCages.has(k) ? '--wrong' : '--ink');
      ctx.fillText(E.label(cage), x + cell * 0.08, y + cell * 0.07);
    });
    ctx.restore();
    Nemo.roundRect(ctx, 1, 1, side - 2, side - 2, 6);
    ctx.strokeStyle = c('--ink'); ctx.lineWidth = 2; ctx.stroke();
  }

  NumberPuzzle({
    kind: 'calc',
    levels: E.LEVELS,
    emptySize: 4,
    maxWidth: 560,
    size: p => p.size,
    peers,
    generate: id => E.generate(id),
    subtitle: p => `${t(E.LEVELS[p.level - 1].name)} · ${p.size}×${p.size}`,
    detail: l => `${l.size}×${l.size} · ${opsText(l.ops)}`,
    menuLabel: l => `${t(l.name)} · ${l.size}×${l.size}`,
    options: [
      { key: 'showConflicts', label: '중복 숫자 표시', default: true },
      { key: 'showWrongCages', label: '계산이 틀린 묶음 표시', default: true },
    ],
    validate: p => p.size >= 3 && p.size <= 9 && Array.isArray(p.cages) && p.cages.every(c => Array.isArray(c.cells) && c.cells.length && E.SYMBOL[c.op] != null),
    progress: NumberPuzzle.progress,
    hit: (x, y, side, n) => {
      const cell = side / n, col = Math.floor(x / cell), row = Math.floor(y / cell);
      return col >= 0 && col < n && row >= 0 && row < n ? row * n + col : null;
    },
    draw,
  });
})();
</script>
</body>
</html>
