<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="누른 칸의 가로줄과 세로줄이 함께 바뀌는 스위치네모. 모든 불을 켜는 논리 퍼즐.">
<meta name="theme-color" content="#f6f4ec">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="assets/paper.css">
<style>
:root { --accent: var(--fill-switch); }
.lamps { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; padding: 8px; border-radius: 14px; background: var(--sheet);
  width: var(--side); height: var(--side); touch-action: manipulation; }
.board-wrap.empty .lamps { opacity: .35; }
.lamp { border: 0; padding: 0; border-radius: 10px; background: var(--sw-off); display: grid; place-items: center; position: relative;
  transition: background-color .18s ease, transform .12s ease; }
.lamp::after { content: ""; width: 34%; aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--sw-ring); transition: all .18s ease; }
.lamp.on { background: var(--sw-on); }
.lamp.on::after { background: var(--sw-core); border-color: transparent;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--sw-core) 45%, transparent), 0 0 18px var(--sw-glow); }
/* 마우스를 올리면 누를 때 바뀔 가로줄·세로줄을 미리 보여준다 */
.lamp.cross { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--ink) 45%, transparent); }
.lamp.flip { animation: flip .22s ease-out; }
@keyframes flip { from { transform: scale(.86); } }
.lamp:disabled { cursor: default; }
.status { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; font-size: 14px; font-variant-numeric: tabular-nums; }
.status span + span::before { content: "·"; margin-right: 14px; color: var(--ink-soft); }
.status .min { font-weight: 600; }
</style>
<title>Switch Squares</title>
</head>
<body>
<div class="puzzle" id="app">
  <div class="stage">
    <div class="board-wrap empty" id="wrap"><div class="lamps" id="lamps" role="grid"></div></div>
    <p class="status" id="status" aria-live="polite"></p>
    <p class="guide" id="guide"></p>
  </div>
  <div class="controls">
    <div class="tools">
      <button class="tool" id="undo"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span></span></button>
      <button class="tool" id="restart"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg><span></span></button>
    </div>
  </div>
</div>
<script src="assets/i18n.js"></script>
<script src="assets/common.js"></script>
<script src="assets/switch-engine.js"></script>
<script>
(() => {
  // 앱에 화면은 아직 없다. 규칙은 FieldSweeper/Model/SwitchEngine.swift와 같다.
  const E = SwitchEngine, { t, store, stats, clock } = Nemo;
  const K = Nemo.kind('switch');
  const $ = id => document.getElementById(id);
  const app = $('app'), wrap = $('wrap'), grid = $('lamps');
  const bar = Nemo.topBar('switch');
  app.prepend(bar);
  const q = sel => bar.querySelector(sel);
  const RECENT = 50;
  let showTimer = store.get('showTimer', true);

  // failed: 지옥에서 최소 횟수를 다 쓰고도 못 푼 상태. 판이 멈추고 처음부터 다시나 새 퍼즐만 할 수 있다.
  const G = { puzzle: null, state: [], history: [], status: 'empty', failed: false, counted: false, timer: new Nemo.Timer(), isNewBest: false };
  const size = () => (G.puzzle ? G.puzzle.size : 4);
  const level = () => E.LEVELS[(G.puzzle ? G.puzzle.level : 1) - 1];
  const subtitle = () => (G.puzzle ? `${t(level().name)} · ${size()}×${size()}` : '');
  const onCount = () => G.state.filter(Boolean).length;

  // ── 시작·저장. 상태는 처음 판에 누른 기록을 다시 적용해 만든다. ──
  function start(puzzle, saved) {
    G.puzzle = puzzle;
    G.history = saved ? saved.history.slice() : [];
    G.state = puzzle.start.slice();
    for (const i of G.history) E.press(G.state, i, puzzle.size);
    G.counted = saved ? !!saved.counted : false;
    G.isNewBest = false;
    G.timer = new Nemo.Timer(saved ? saved.elapsed : 0);
    G.timer.start();
    G.status = 'playing';
    G.failed = false;
    build();
    // 지옥에서 실패한 채로 저장된 판을 다시 열면 실패 안내를 다시 보여준다.
    if (outOfMoves()) fail(!!saved);
    render();
  }
  const outOfMoves = () => level().limitsMoves && G.history.length >= G.puzzle.solution.length && !G.state.every(Boolean);
  function fail(showCard = true) {
    G.failed = true;
    G.timer.pause();
    cross(null);
    if (!showCard) return;
    const min = G.puzzle.solution.length;
    setTimeout(() => {
      const el = Nemo.overlay(`<div class="card center" role="alertdialog" aria-modal="true" aria-labelledby="flTitle">
        <h3 id="flTitle">${Nemo.esc(t('최소 {0}회 안에 풀지 못했어요', min))}</h3><p>${Nemo.esc(t('지옥에서는 최소 횟수 안에 모든 불을 켜야 해요.'))}</p>
        <div class="actions"><button class="btn" data-restart>${t('처음부터 다시')}</button><button class="btn primary" data-new data-focus>${t('새 퍼즐')}</button></div></div>`,
      { onBackdrop: () => Nemo.close() });
      el.querySelector('[data-restart]').onclick = () => { Nemo.close(); restartPuzzle(); };
      el.querySelector('[data-new]').onclick = () => newPuzzle(G.puzzle.level);
    }, 350);
  }
  function restartPuzzle() {
    start(G.puzzle, { history: [], elapsed: G.timer.seconds, counted: G.counted });
    save();
  }
  function restore(s) {
    const p = s && s.puzzle;
    if (!p || !(p.size >= 2) || p.start?.length !== p.size * p.size || !Array.isArray(p.solution) || !E.LEVELS[p.level - 1]
      || !Array.isArray(s.history) || !s.history.every(i => Number.isInteger(i) && i >= 0 && i < p.size * p.size)) return false;
    start(p, s);
    return true;
  }
  function save() {
    if (G.status !== 'playing') return;
    store.set('switch.save', { puzzle: G.puzzle, state: G.state, history: G.history, elapsed: G.timer.seconds, counted: G.counted, savedAt: Date.now() });
  }

  // ── 입력 ──
  function pressAt(i) {
    if (G.status !== 'playing' || G.failed) return;
    E.press(G.state, i, size());
    G.history.push(i);
    if (!G.counted) { G.counted = true; stats.recordStart('switch'); }
    flash(i);
    if (!checkWin()) {
      if (outOfMoves()) fail();
      save();
    }
    render();
  }
  function undo() {
    if (G.status !== 'playing' || G.failed || level().noUndo || !G.history.length) return;
    const i = G.history.pop();
    E.press(G.state, i, size());
    flash(i);
    render(); save();
  }
  function checkWin() {
    if (!G.state.every(Boolean)) return false;
    G.timer.pause();
    G.status = 'won';
    store.set('switch.save', null);
    G.isNewBest = stats.recordWin('switch', level().name, Math.round(G.timer.seconds));
    setTimeout(() => { if (G.status === 'won') showResult(); }, 450);
    return true;
  }

  // ── 화면 ──
  let lamps = [];
  function build() {
    const n = size();
    grid.style.setProperty('--n', n);
    lamps = [...Array(n * n)].map((_, i) => {
      const b = document.createElement('button');
      b.className = 'lamp';
      b.setAttribute('role', 'gridcell');
      b.onclick = () => pressAt(i);
      b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') cross(i); });
      b.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') cross(null); });
      return b;
    });
    grid.replaceChildren(...lamps);
    fit();
  }
  function cross(i) {
    const n = size();
    lamps.forEach((b, k) => b.classList.toggle('cross', i != null && G.status === 'playing' && !G.failed
      && (Math.floor(k / n) === Math.floor(i / n) || k % n === i % n)));
  }
  function flash(i) {
    const n = size();
    lamps.forEach((b, k) => {
      if (Math.floor(k / n) !== Math.floor(i / n) && k % n !== i % n) return;
      b.classList.remove('flip');
      void b.offsetWidth;
      b.classList.add('flip');
    });
  }
  function render() {
    const n = size(), playing = G.status === 'playing', active = playing && !G.failed, lv = level();
    q('[data-sub]').textContent = subtitle();
    q('[data-pause]').disabled = !active;
    wrap.classList.toggle('empty', G.status === 'empty');
    lamps.forEach((b, i) => {
      const on = !!G.state[i];
      b.classList.toggle('on', on);
      b.disabled = !active;
      b.setAttribute('aria-label', `${t('{0}행 {1}열', Math.floor(i / n) + 1, (i % n) + 1)}, ${t(on ? '켜짐' : '꺼짐')}`);
    });
    const parts = G.puzzle ? [t('켜진 불 {0}/{1}', onCount(), n * n), t('조작 {0}회', G.history.length)] : [];
    if (G.puzzle && lv.limitsMoves) parts.push(`<b class="min">${t('남은 {0}회', Math.max(0, G.puzzle.solution.length - G.history.length))}</b>`);
    else if (G.puzzle && lv.showsMinimum) parts.push(`<b class="min">${t('최소 {0}회', G.puzzle.solution.length)}</b>`);
    $('guide').textContent = G.puzzle && lv.limitsMoves ? t('최소 횟수 안에 풀어야 해요. 되돌리기는 쓸 수 없어요.') : t('누른 칸의 가로줄과 세로줄이 모두 바뀌어요. 불을 모두 켜 주세요.');
    $('status').innerHTML = parts.map(p => `<span>${p}</span>`).join('');
    $('undo').disabled = !active || lv.noUndo || !G.history.length;
    $('restart').disabled = !playing || !G.history.length;
    tick();
  }
  function tick() {
    const show = showTimer && G.status === 'playing' && !G.failed;
    q('[data-timer]').hidden = !show;
    if (show) q('[data-time]').textContent = clock(Math.floor(G.timer.seconds));
  }
  setInterval(tick, 250);
  function fit() {
    const side = Math.floor(Math.min(wrap.clientWidth, wrap.clientHeight, 480));
    if (side > 0) grid.style.setProperty('--side', side + 'px');
  }
  new ResizeObserver(fit).observe(wrap);

  // 방향키로 칸 사이를 옮겨 다닌다. Enter·Space는 버튼이 직접 누른다.
  grid.addEventListener('keydown', e => {
    const i = lamps.indexOf(document.activeElement), n = size();
    if (i < 0) return;
    const d = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[e.key];
    if (!d) return;
    e.preventDefault();
    const r = Math.min(n - 1, Math.max(0, Math.floor(i / n) + d[0])), c = Math.min(n - 1, Math.max(0, (i % n) + d[1]));
    lamps[r * n + c].focus();
  });
  document.addEventListener('keydown', e => {
    if (G.status === 'playing' && !Nemo.isOpen() && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  });

  // ── 겹쳐 보이는 창 ──
  const time = () => (showTimer ? clock(Math.round(G.timer.seconds)) : null);
  function showLevels() {
    G.timer.pause();
    const best = stats.load('switch').bestByDifficulty;
    Nemo.levelPicker({
      items: E.LEVELS.map(l => ({ id: l.id, name: t(l.name), best: best[l.name],
        detail: t('{0}×{1} · 최소 {2}~{3}회', l.size, l.size, l.moves[0], l.moves[1]) + (l.limitsMoves ? ` · ${t('횟수 제한')}` : '') })),
      current: store.get('switch.lastLevel', 1), canCancel: G.status !== 'empty',
      onPick: newPuzzle,
      onCancel: () => { if (G.status === 'empty') location.href = './'; else G.timer.start(); },
    });
  }
  function newPuzzle(id) {
    store.set('switch.lastLevel', id);
    // 최근에 낸 판(회전·뒤집기 포함)은 다시 내지 않는다. 화면에는 보이지 않는다.
    const recent = store.get('switch.recent', []);
    const puzzle = E.generate(id, recent);
    store.set('switch.recent', recent.concat(E.canonicalKey(puzzle.start, puzzle.size)).slice(-RECENT));
    store.set('switch.save', null);
    Nemo.close();
    start(puzzle);
    save();
  }
  function pause() {
    if (G.status !== 'playing' || G.failed || Nemo.isOpen()) return;
    G.timer.pause();
    save();
    Nemo.pauseCover({ subtitle: subtitle(), time: time(), onResume: () => G.timer.start() });
  }
  function askRestart() {
    // 지옥에서 실패한 뒤에는 묻지 않고 바로 처음부터
    if (G.failed) return restartPuzzle();
    G.timer.pause();
    Nemo.confirmBox({ title: t('처음부터 다시 풀까요?'), message: t('같은 문제를 처음 상태로 되돌려요.'), ok: t('다시 풀기'),
      onOk: restartPuzzle, onCancel: () => { if (!G.failed) G.timer.start(); } });
  }
  function showResult() {
    const moves = G.history.length, min = G.puzzle.solution.length;
    Nemo.result({ title: t('{0} 완성', K.title), subtitle: subtitle(),
      note: moves <= min ? `${t('최소 조작으로 풀었어요')} · ${t('조작 {0}회', moves)}` : t('조작 {0}회 · 최소 {1}회', moves, min),
      time: time(), isNewBest: G.isNewBest,
      onClose: () => {}, onOther: showLevels, onAgain: () => newPuzzle(G.puzzle.level) });
  }

  $('undo').onclick = undo;
  $('restart').onclick = askRestart;
  q('[data-pause]').onclick = pause;
  q('[data-back]').addEventListener('click', save);
  Nemo.menu(q('[data-more]'), q('[data-menu]'), () => [
    { section: t('새 퍼즐') },
    ...E.LEVELS.map(l => ({ label: `${t(l.name)} · ${l.size}×${l.size}`, onClick: () => newPuzzle(l.id) })),
    { sep: true },
    { label: t('처음부터 다시'), icon: 'restart', disabled: G.status !== 'playing' || !G.history.length, onClick: askRestart },
  ]);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('pagehide', save);

  document.title = `${K.title} · ${t('네모 안에 네모')}`;
  $('undo').querySelector('span').textContent = t('되돌리기');
  $('restart').querySelector('span').textContent = t('처음부터 다시');
  $('guide').textContent = t('누른 칸의 가로줄과 세로줄이 모두 바뀌어요. 불을 모두 켜 주세요.');
  build();
  if (!restore(store.get('switch.save', null))) { render(); showLevels(); }
})();
</script>
</body>
</html>
