<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="추측 없이 논리로만 풀리는 스도쿠. 네 가지 난이도, 메모, 되돌리기.">
<meta name="theme-color" content="#f6f4ec">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="assets/paper.css">
<style>:root { --accent: var(--fill-sudoku); }</style>
<title>Sudoku</title>
</head>
<body>
<div class="puzzle" id="app">
  <div class="stage">
    <div class="board-wrap empty" id="wrap"><canvas class="board" id="board" role="img"></canvas></div>
  </div>
  <div class="controls">
    <div class="tools">
      <button class="tool" id="undo"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span></span></button>
      <button class="tool" id="erase"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 20H20"/><path d="M5.6 15.6l8.5-8.5a2 2 0 0 1 2.8 0l2 2a2 2 0 0 1 0 2.8L12 18.8a4 4 0 0 1-2.8 1.2H8.6a2 2 0 0 1-1.4-.6l-1.6-1.6a2 2 0 0 1 0-2.2z"/><path d="M10 11.2l4.8 4.8"/></svg><span></span></button>
      <button class="tool" id="note" aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4.5L15.5 5a2.1 2.1 0 0 1 3 3L8 18.5z"/><path d="M13.5 7l3 3"/></svg><span></span></button>
    </div>
    <div class="keys" id="keys"></div>
  </div>
</div>
<script src="assets/i18n.js"></script>
<script src="assets/common.js"></script>
<script src="assets/sudoku-engine.js"></script>
<script src="assets/number-puzzle.js"></script>
<script>
(() => {
  const E = SudokuEngine, { t } = Nemo;

  // 같은 줄·열·구역에 같은 숫자가 있는 칸, 정답과 다른 칸
  const conflicts = G => new Set(G.values.map((v, i) => (v && E.peers[i].some(p => G.values[p] === v) ? i : -1)).filter(i => i >= 0));
  const mistakes = G => new Set(G.values.map((v, i) => (v && v !== G.puzzle.solution[i] ? i : -1)).filter(i => i >= 0));

  function draw(ctx, side, G, opts) {
    const c = name => Nemo.cssColor(name);
    const cell = side / 9;
    const wrong = new Set([...(opts.showConflicts ? conflicts(G) : []), ...(opts.showMistakes ? mistakes(G) : [])]);
    const sel = G.selected, selValue = sel != null ? G.values[sel] : 0;
    const font = (size, weight) => `${weight} ${size}px system-ui, -apple-system, sans-serif`;
    ctx.save();
    Nemo.roundRect(ctx, 0, 0, side, side, 6);
    ctx.clip();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < 81; i++) {
      const x = (i % 9) * cell, y = Math.floor(i / 9) * cell;
      let fill = '--cell';
      if (sel != null) {
        if (i === sel) fill = '--sd-selected';
        else if (selValue && G.values[i] === selValue) fill = '--sd-same';
        else if (Math.floor(i / 9) === Math.floor(sel / 9) || i % 9 === sel % 9 || E.box(i) === E.box(sel)) fill = '--sd-related';
      }
      ctx.fillStyle = c(fill);
      ctx.fillRect(x, y, cell + 0.5, cell + 0.5);
      const v = G.values[i];
      if (v) {
        const given = !!G.puzzle.givens[i];
        ctx.fillStyle = c(wrong.has(i) && !given ? '--wrong' : given ? '--ink' : '--user');
        ctx.font = font(cell * 0.56, given ? 600 : 400);
        ctx.fillText(v, x + cell / 2, y + cell / 2 + cell * 0.03);
      } else if (G.notes[i]) {
        ctx.font = font(cell * 0.24, 500);
        for (let d = 1; d <= 9; d++) {
          if (!(G.notes[i] & (1 << d))) continue;
          ctx.fillStyle = c(selValue === d ? '--ink' : '--ink-soft');
          ctx.fillText(d, x + cell * (((d - 1) % 3) + 0.5) / 3, y + cell * (Math.floor((d - 1) / 3) + 0.5) / 3 + 1);
        }
      }
    }
    ctx.beginPath();
    for (let k = 1; k < 9; k++) {
      if (k % 3 === 0) continue;
      const p = Math.round(k * cell) + 0.5;
      ctx.moveTo(p, 0); ctx.lineTo(p, side); ctx.moveTo(0, p); ctx.lineTo(side, p);
    }
    ctx.strokeStyle = c('--thin'); ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath();
    for (const k of [3, 6]) {
      const p = Math.round(k * cell);
      ctx.moveTo(p, 0); ctx.lineTo(p, side); ctx.moveTo(0, p); ctx.lineTo(side, p);
    }
    ctx.strokeStyle = c('--ink'); ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    Nemo.roundRect(ctx, 1, 1, side - 2, side - 2, 6);
    ctx.strokeStyle = c('--ink'); ctx.lineWidth = 2; ctx.stroke();
  }

  NumberPuzzle({
    kind: 'sudoku',
    levels: E.LEVELS,
    emptySize: 9,
    maxWidth: 560,
    drawEmpty: true,
    size: () => 9,
    peers: () => E.peers,
    generate: id => E.generate(id),
    subtitle: p => t(E.LEVELS[p.level - 1].name),
    detail: l => t(l.detail),
    menuLabel: l => t(l.name),
    options: [
      { key: 'showConflicts', label: '중복 숫자 표시', default: true },
      { key: 'showMistakes', label: '틀린 숫자 바로 표시', default: false },
    ],
    validate: p => p.givens.length === 81,
    progress: NumberPuzzle.progress,
    hit: (x, y, side) => {
      const cell = side / 9, c = Math.floor(x / cell), r = Math.floor(y / cell);
      return c >= 0 && c < 9 && r >= 0 && r < 9 ? r * 9 + c : null;
    },
    draw: (ctx, side, G, opts) => {
      if (!G.puzzle) G = { ...G, values: new Array(81).fill(0), notes: new Array(81).fill(0), puzzle: { givens: [], solution: [] } };
      draw(ctx, side, G, opts);
    },
  });
})();
</script>
</body>
</html>
